name: vikash

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vikash_db
      POSTGRES_USER: ${DB_USERNAME:?Preencha DB_USERNAME no .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: vikash-api:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME:?Preencha DB_USERNAME no .env}
      DB_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Preencha JWT_ACCESS_SECRET no .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Preencha JWT_REFRESH_SECRET no .env}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Preencha GEMINI_API_KEY no .env}
      LOGIN_EMAIL_LIMIT: ${LOGIN_EMAIL_LIMIT:-10}
      LOGIN_ORIGIN_LIMIT: ${LOGIN_ORIGIN_LIMIT:-100}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      AI_PER_MINUTE: ${AI_PER_MINUTE:-5}
      AI_PER_DAY: ${AI_PER_DAY:-50}
      AI_GLOBAL_PER_DAY: ${AI_GLOBAL_PER_DAY:-500}
      AI_PER_USER_CONCURRENT: ${AI_PER_USER_CONCURRENT:-1}
      AI_GLOBAL_CONCURRENT: ${AI_GLOBAL_CONCURRENT:-4}
      AI_MAX_INPUT_BYTES: ${AI_MAX_INPUT_BYTES:-100000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-2048}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@vikash.local}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:5173/reset-password}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/vikash_db
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    mem_limit: 768m
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/institutions"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
