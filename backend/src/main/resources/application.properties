# Importa o .env ao iniciar em backend/ ou na raiz do repositorio.
spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

server.port=8080
spring.application.name=vikash-api

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.from=${SMTP_FROM:no-reply@vikash.local}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
security.password-reset.url=${PASSWORD_RESET_URL:http://localhost:5173/reset-password}

# Limita a fila de envio dos e-mails de recuperação.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=100
spring.datasource.url=jdbc:postgresql://localhost:5432/vikash_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
security.jwt.access-token-secret=${JWT_ACCESS_SECRET}
security.jwt.refresh-token-secret=${JWT_REFRESH_SECRET}
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000
security.login.email-limit=${LOGIN_EMAIL_LIMIT:10}
security.login.origin-limit=${LOGIN_ORIGIN_LIMIT:100}
security.login.window-seconds=${LOGIN_WINDOW_SECONDS:900}
security.ai.per-minute=${AI_PER_MINUTE:5}
security.ai.per-day=${AI_PER_DAY:50}
security.ai.global-per-day=${AI_GLOBAL_PER_DAY:500}
security.ai.per-user-concurrent=${AI_PER_USER_CONCURRENT:1}
security.ai.global-concurrent=${AI_GLOBAL_CONCURRENT:4}
security.ai.max-input-bytes=${AI_MAX_INPUT_BYTES:100000}
security.ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:2048}
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent
