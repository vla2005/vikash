spring.application.name=vikash-api-test
spring.jackson.deserialization.accept-float-as-int=false

# Valores ficticios: testes nao dependem do .env local nem de credenciais reais.
gemini.api.key=test-key
gemini.api.url=http://localhost:1/test-gemini

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

security.jwt.access-token-secret=5e6e3caca637af531b4e65baca1f6e810e955f91cc2243592b5630df912e7798
security.jwt.refresh-token-secret=8d03ddc2ec72a54e802e185b9d01c790f5dde148b3484aa19cbeb5876b0ffdb5
security.jwt.access-token-expiration-ms=900000
security.jwt.refresh-token-expiration-ms=604800000

# Nenhum teste deve enviar e-mails reais.
spring.mail.host=localhost
spring.mail.port=1
spring.mail.from=no-reply@example.com
spring.mail.username=
spring.mail.password=
security.password-reset.url=https://vikash.example/reset-password

# O build nao herda flags/credenciais de producao. Cenarios especificos habilitam
# suas etapas explicitamente via @SpringBootTest e usam provedores simulados.
assistant.planning.enabled=false
assistant.execution.enabled=false
assistant.answer.enabled=false
assistant.memory.enabled=false

