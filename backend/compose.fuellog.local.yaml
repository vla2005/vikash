# Local-only bridge: PC and FuelLog use the same canonical loopback origin.
# Requires FuelLog's existing fuellog-api-1 container and fuellog_default network.
services:
  api:
    ports: !override
      # Optional LAN binding is for the ViKash app; OAuth HTTP URLs remain loopback-only.
      - "${LOCAL_API_BIND:-127.0.0.1}:${LOCAL_API_PORT:-8082}:8080"
    networks:
      default: {}
      fuellog_local:
        aliases: [vikash-local-api]

  fuellog-loopback:
    image: nginx:stable-alpine
    network_mode: "container:fuellog-api-1"
    entrypoint: ["nginx", "-g", "daemon off;"]
    user: "101:101"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./local/fuellog/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "2"

networks:
  fuellog_local:
    external: true
    name: fuellog_default
